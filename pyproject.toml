[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apolo"
version = "1.0.0"
description = "CLI tool to download, tag with rich metadata, fetch synced lyrics, and organize music into your library."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "hypr" }
]
dependencies = [
    "yt-dlp",
    "mutagen",
    "requests",
    "rich",
    "typer>=0.9.0",
    "rapidfuzz>=3.0.0",
    "pillow>=10.0.0",
    "musicbrainzngs>=0.7.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0"
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-Pillow>=10.0.0"
]

[project.scripts]
apolo = "apolo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apolo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
