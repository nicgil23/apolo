<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apolo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header: YouTube Brand & Status -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="yt-brand-logo" title="Apolo">
        <svg class="yt-red-badge" viewBox="0 0 32 22" aria-hidden="true">
          <rect width="32" height="22" rx="6" fill="#FF0000"/>
          <path d="M16 4.5v7.03c-.39-.23-.85-.36-1.33-.36-1.47 0-2.67 1.19-2.67 2.67s1.2 2.67 2.67 2.67 2.67-1.19 2.67-2.67V7h2.67V4.5H16z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="yt-wordmark">
        <span class="yt-brand-name">Apolo</span>
        <span class="yt-badge-tag">YT</span>
      </div>
    </div>
    <div id="status-chip" class="status-chip offline" title="Estado de la conexión">
      <span class="status-dot"></span>
      <span id="status-text">Desconectado</span>
    </div>
  </header>

  <!-- Primary Action Button: YouTube Subscribe style -->
  <div class="action-container">
    <button id="download-tab-btn" class="btn-yt-primary">
      <svg viewBox="0 0 24 24" class="btn-icon"><path d="M17 18v2H7v-2h10ZM12 4.5v8.67l3.3-3.3 1.4 1.4-5.7 5.7-5.7-5.7 1.4-1.4 3.3 3.3V4.5h2Z"/></svg>
      <span id="btn-label">Descargar pestaña activa</span>
    </button>
  </div>

  <!-- History Section -->
  <section class="history-section">
    <div class="history-header">
      <span class="section-title">HISTORIAL</span>
      <div class="history-actions">
        <span id="task-counter" class="task-counter-badge">0 tareas</span>
        <button id="btn-clear-history" class="btn-clear-history" title="Limpiar historial">
          <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          <span>Limpiar</span>
        </button>
      </div>
    </div>
    <div id="task-list" class="task-list">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>Sin descargas activas</span>
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
