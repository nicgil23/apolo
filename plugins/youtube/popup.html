<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apolo</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #18181c;
      --border: #27272a;
      --border-subtle: #1f1f23;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #e4e4e7;
      --accent-hover: #ffffff;
      --status-ok: #10b981;
      --status-active: #3b82f6;
      --status-warn: #f59e0b;
      --status-err: #ef4444;
      --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-mono);
    }

    body {
      width: 340px;
      padding: 12px;
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--text);
      font-size: 11.5px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      user-select: none;
    }

    /* Single-line header: Brand + Status + Action in one line */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-icon {
      width: 14px;
      height: 14px;
      fill: var(--text);
    }

    .brand-name {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--font-mono);
    }

    .status-indicator {
      width: 6px;
      height: 6px;
      background: var(--status-err);
      display: inline-block;
      margin-left: 2px;
    }

    .status-indicator.online {
      background: var(--status-ok);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
    }

    .btn-download-tab {
      background: var(--accent);
      color: #09090b;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .btn-download-tab:hover {
      background: var(--accent-hover);
    }

    .btn-download-tab:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-download-tab svg {
      width: 11px;
      height: 11px;
      fill: currentColor;
    }

    /* History section */
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
    }

    .task-card:hover {
      border-color: #3f3f46;
    }

    .task-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .task-title {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-family: var(--font-mono);
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .task-badge {
      font-size: 9.5px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .task-badge.completed { color: var(--status-ok); }
    .task-badge.downloading { color: var(--status-active); font-weight: 600; }
    .task-badge.queued { color: var(--status-warn); }
    .task-badge.failed { color: var(--status-err); }
    .task-badge.cancelled { color: var(--text-dim); }

    .btn-cancel-task {
      background: transparent;
      border: 1px solid #3f3f46;
      border-radius: 2px;
      color: #a1a1aa;
      font-size: 9.5px;
      font-family: var(--font-mono);
      padding: 1px 4px;
      cursor: pointer;
      line-height: 1.2;
    }

    .btn-cancel-task:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--status-err);
      color: #fca5a5;
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 2px;
      background: #27272a;
      border-radius: 1px;
      overflow: hidden;
      margin: 2px 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--status-active);
      transition: width 0.2s ease;
    }

    /* Full URL display */
    .task-url-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .task-full-url {
      font-size: 9.5px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      word-break: break-all;
      line-height: 1.3;
    }

    .btn-copy-url {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      flex-shrink: 0;
    }

    .btn-copy-url:hover {
      color: var(--text);
    }

    .btn-copy-url svg {
      width: 11px;
      height: 11px;
      fill: currentColor;
    }

    .empty-state {
      padding: 16px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 10.5px;
      font-family: var(--font-mono);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <!-- Top header line: Brand + Status + Download button in one line -->
  <div class="top-bar">
    <div class="brand-group">
      <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span class="brand-name">Apolo</span>
      <span id="status-indicator" class="status-indicator" title="Estado del servidor"></span>
    </div>
    <button id="download-tab-btn" class="btn-download-tab">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span id="btn-label">Descargar pestaña</span>
    </button>
  </div>

  <!-- Interactive history list -->
  <div class="history-section">
    <div class="history-header">
      <span class="section-title">Historial</span>
      <span id="task-counter" class="section-title" style="color: var(--text-dim);">0 tareas</span>
    </div>
    <div id="task-list" class="task-list">
      <div class="empty-state">Sin descargas activas</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
